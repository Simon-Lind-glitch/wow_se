# Never translated: the names of individual people and places.
#
# Policy, decided 2026-08-22: translate everything EXCEPT names. Earlier this
# list also held creature types, item names and class names, kept English so
# the kids could search Wowhead and ask in chat. That reason is retired — the
# dual-language rendering shows the English original directly beneath the
# Swedish, so the lookup path is already there.
#
# What stays English is now only what a name is: individuals and places. A
# creature type ("Mottled Boar"), an item ("Burning Blade Medallion") or a
# class word ("warrior") gets translated like any other noun.
#
# The rough edge to know about: mob nameplates and bag item names come from the
# server and cannot be translated, so Swedish quest text will not match them
# word-for-word. The grey English line underneath is what bridges that — which
# is fine while it is on screen, and is why the quest tracker (no room for two
# languages) is the place to watch.
