  Warchief: krigshövding

# Never translated, even when they look like ordinary words. Proper nouns stay
# English so the kids can still read guides, look things up on Wowhead, and
# talk to other players (spec §6).
#
# This list is a backstop for the cases a model is most likely to "helpfully"
# translate. The general rule — all NPC, zone, item, spell and creature names
# stay English — is in the system prompt.
keep_english:
  - Horde
  - Alliance
  - Durotar
  - Orgrimmar
  - Valley of Trials
