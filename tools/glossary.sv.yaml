# Locked term translations. The authority for consistency across every string.
#
# Spec §6: "Consistency across quests matters more than any individual best
# rendering." A child reading two quests that call the same thing by two names
# has to stop and work out whether they are the same thing. So this file wins
# over any nicer one-off phrasing a model proposes.
#
# Register: a Swedish nine-year-old. Everyday words, not the literary or
# archaic register WoW's English often uses.
#
# Editing this file invalidates nothing automatically — run
# `make translate ARGS=--recheck-glossary` to find cached translations that now
# disagree with it.

version: 1

# Recurring game vocabulary. Left side is the English term as it appears in
# source text; right side is the only Swedish rendering allowed.
